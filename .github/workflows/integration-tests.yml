name: Backend CI - Integration Tests (Dockerized)

on:
  push:
    paths:
      - "Backend/**"
      - ".github/workflows/integration-tests.yml"
    branches:
      - main
      - develop
      - CI-Automation-testing

  pull_request:
    paths:
      - "Backend/**"
      - ".github/workflows/integration-tests.yml"
    branches:
      - main
      - develop

  workflow_dispatch:

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Service containers run on the host network of the runner
    services:
      mongo:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:v1.15.1
        ports:
          - 6333:6333
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:6333/healthz || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t backend-ci -f Backend/Dockerfile.ci Backend/

      - name: Run integration tests (Docker)
        env:
          CI: "true"
          # Services are accessible via localhost because we use --network host
          MONGO_URI: mongodb://localhost:27017
          MONGO_DB: test_integration_db
          QDRANT_HOST: localhost
          QDRANT_PORT: "6333"
          COLLECTION_NAME: test_integration_collection
          JWT_SECRET: test-secret-key-for-integration-tests-only
          KEY_ENCRYPTION_KEY: Gs8d0pOL_hhYuwRB_NKiVUh3-2j0PLQkm_i4iZGiEAk=
          ADMIN_EMAIL: admin@integration.example.com
          ADMIN_PASSWORD: admin123
          REDIS_URL: redis://localhost:6379/0
          MAX_REQUESTS: "100"
          WINDOW_SECONDS: "60"
          FRONTEND_URL: http://localhost:5173
          GIT_TERMINAL_PROMPT: "0"
          GIT_ASKPASS: "echo"
          GIT_SSH_COMMAND: "ssh -o BatchMode=yes"
        run: |
          # We use --network host so the container shares the network namespace with the runner
          # This allows it to access the service containers exposed on localhost ports
          docker run --network host \
            --env CI \
            --env MONGO_URI \
            --env MONGO_DB \
            --env QDRANT_HOST \
            --env QDRANT_PORT \
            --env COLLECTION_NAME \
            --env JWT_SECRET \
            --env KEY_ENCRYPTION_KEY \
            --env ADMIN_EMAIL \
            --env ADMIN_PASSWORD \
            --env REDIS_URL \
            --env MAX_REQUESTS \
            --env WINDOW_SECONDS \
            --env FRONTEND_URL \
            --env GIT_TERMINAL_PROMPT \
            --env GIT_ASKPASS \
            --env GIT_SSH_COMMAND \
            backend-ci \
            bash -c "pytest tests/integration/ -v --tb=short --maxfail=5 -m 'not slow' || pytest tests/integration/ -v --tb=short --maxfail=5"

      - name: Run integration tests with coverage (Docker)
        if: always() # Run even if previous step failed, or optional: make this the main step
        env:
          CI: "true"
          MONGO_URI: mongodb://localhost:27017
          MONGO_DB: test_integration_db
          QDRANT_HOST: localhost
          QDRANT_PORT: "6333"
          COLLECTION_NAME: test_integration_collection
          JWT_SECRET: test-secret-key-for-integration-tests-only
          KEY_ENCRYPTION_KEY: Gs8d0pOL_hhYuwRB_NKiVUh3-2j0PLQkm_i4iZGiEAk=
          ADMIN_EMAIL: admin@integration.example.com
          ADMIN_PASSWORD: admin123
          REDIS_URL: redis://localhost:6379/0
          MAX_REQUESTS: "100"
          WINDOW_SECONDS: "60"
          FRONTEND_URL: http://localhost:5173
          GIT_TERMINAL_PROMPT: "0"
          GIT_ASKPASS: "echo"
          GIT_SSH_COMMAND: "ssh -o BatchMode=yes"
        run: |
          # Mount current directory to /app/coverage_output to get the reports back
          docker run --network host \
            -v ${{ github.workspace }}/Backend/coverage_reports:/app/coverage_reports \
            --env CI \
            --env MONGO_URI \
            --env MONGO_DB \
            --env QDRANT_HOST \
            --env QDRANT_PORT \
            --env COLLECTION_NAME \
            --env JWT_SECRET \
            --env KEY_ENCRYPTION_KEY \
            --env ADMIN_EMAIL \
            --env ADMIN_PASSWORD \
            --env REDIS_URL \
            --env MAX_REQUESTS \
            --env WINDOW_SECONDS \
            --env FRONTEND_URL \
            --env GIT_TERMINAL_PROMPT \
            --env GIT_ASKPASS \
            --env GIT_SSH_COMMAND \
            backend-ci \
            bash -c "pytest tests/integration/ -v --cov=app --cov-report=term-missing --cov-report=xml:/app/coverage_reports/coverage.xml --cov-report=html:/app/coverage_reports/htmlcov --tb=short"

      - name: Upload coverage reports (if generated)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-coverage-report
          path: |
            Backend/coverage_reports/htmlcov/
            Backend/coverage_reports/coverage.xml
          if-no-files-found: ignore

      - name: Test Summary
        if: always()
        run: |
          echo "## Backend Integration Tests Completed (Dockerized)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Execution" >> $GITHUB_STEP_SUMMARY
          echo "- Tests ran inside a lightweight Docker container (python:3.12-slim)" >> $GITHUB_STEP_SUMMARY
          echo "- Playwright browsers were EXCLUDED from the image to save space" >> $GITHUB_STEP_SUMMARY
          echo "- Services provided via GitHub Actions service containers (accessed via host network)" >> $GITHUB_STEP_SUMMARY

