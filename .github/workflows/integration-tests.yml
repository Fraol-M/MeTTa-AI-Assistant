name: Backend CI - Integration Tests

on:
  push:
    paths:
      - "Backend/**"
      - ".github/workflows/integration-tests.yml"
    branches:
      - main
      - develop
      - CI-Automation-testing

  pull_request:
    paths:
      - "Backend/**"
      - ".github/workflows/integration-tests.yml"
    branches:
      - main
      - develop

  # Allow manual triggering
  workflow_dispatch:

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Use GitHub Actions service containers (no Docker build needed!)
    services:
      mongo:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:v1.15.1
        ports:
          - 6333:6333
        # Health check will be done externally from the runner
        options: >-
          --health-cmd "true"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 3

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl
          git --version

      - name: Install Python dependencies
        working-directory: Backend
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Wait for Qdrant to be ready
        run: |
          echo "Waiting for Qdrant service to be ready..."
          # Qdrant takes a bit longer to start, so we wait and check the health endpoint
          for i in {1..30}; do
            if curl -sf http://localhost:6333/healthz 2>/dev/null | grep -q "healthz check passed"; then
              echo "Qdrant is ready!"
              exit 0
            fi
            echo "Attempt $i/30: Qdrant not ready yet, waiting..."
            sleep 3
          done
          echo "Qdrant health check completed (may still be starting)"

      - name: Run integration tests
        working-directory: Backend
        env:
          CI: "true"
          # Services are accessible via localhost in GitHub Actions
          MONGO_URI: mongodb://localhost:27017
          MONGO_DB: test_integration_db
          QDRANT_HOST: localhost
          QDRANT_PORT: "6333"
          COLLECTION_NAME: test_integration_collection
          JWT_SECRET: test-secret-key-for-integration-tests-only
          KEY_ENCRYPTION_KEY: Gs8d0pOL_hhYuwRB_NKiVUh3-2j0PLQkm_i4iZGiEAk=
          ADMIN_EMAIL: admin@integration.example.com
          ADMIN_PASSWORD: admin123
          REDIS_URL: redis://localhost:6379/0
          MAX_REQUESTS: "100"
          WINDOW_SECONDS: "60"
          FRONTEND_URL: http://localhost:5173
          GIT_TERMINAL_PROMPT: "0"
          GIT_ASKPASS: "echo"
          GIT_SSH_COMMAND: "ssh -o BatchMode=yes"
        run: |
          pytest tests/integration/ \
            -v \
            --tb=short \
            --maxfail=5 \
            -m "not slow" || pytest tests/integration/ \
            -v \
            --tb=short \
            --maxfail=5

      - name: Run integration tests with coverage
        working-directory: Backend
        env:
          CI: "true"
          MONGO_URI: mongodb://localhost:27017
          MONGO_DB: test_integration_db
          QDRANT_HOST: localhost
          QDRANT_PORT: "6333"
          COLLECTION_NAME: test_integration_collection
          JWT_SECRET: test-secret-key-for-integration-tests-only
          KEY_ENCRYPTION_KEY: Gs8d0pOL_hhYuwRB_NKiVUh3-2j0PLQkm_i4iZGiEAk=
          ADMIN_EMAIL: admin@integration.example.com
          ADMIN_PASSWORD: admin123
          REDIS_URL: redis://localhost:6379/0
          MAX_REQUESTS: "100"
          WINDOW_SECONDS: "60"
          FRONTEND_URL: http://localhost:5173
          GIT_TERMINAL_PROMPT: "0"
          GIT_ASKPASS: "echo"
          GIT_SSH_COMMAND: "ssh -o BatchMode=yes"
        continue-on-error: true
        run: |
          pytest tests/integration/ \
            -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --tb=short

      - name: Upload coverage reports (if generated)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-coverage-report
          path: |
            Backend/htmlcov/
            Backend/coverage.xml
          if-no-files-found: ignore

      - name: Test Summary
        if: always()
        run: |
          echo "## Backend Integration Tests Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Execution" >> $GITHUB_STEP_SUMMARY
          echo "- Tests run directly on GitHub Actions runner" >> $GITHUB_STEP_SUMMARY
          echo "- No Docker image build required (saves disk space and time)" >> $GITHUB_STEP_SUMMARY
          echo "- Services provided via GitHub Actions service containers" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Services Used" >> $GITHUB_STEP_SUMMARY
          echo "- MongoDB 6.0 (service container)" >> $GITHUB_STEP_SUMMARY
          echo "- Qdrant v1.15.1 (service container)" >> $GITHUB_STEP_SUMMARY
          echo "- Redis 7 (service container)" >> $GITHUB_STEP_SUMMARY
